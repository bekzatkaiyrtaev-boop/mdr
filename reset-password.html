<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МДР — новый пароль</title>
<link rel="stylesheet" href="style.css?v=8">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<div class="auth-box">
  <div class="card">
    <div class="card-header"><span class="title">Новый пароль</span></div>
    <div class="card-body">
      <div class="field-grid" style="grid-template-columns:1fr;gap:12px;" id="formBlock">
        <div class="field">
          <label>Новый пароль</label>
          <input type="password" id="password" placeholder="••••••••">
          <span class="muted" style="font-size:11px;">минимум 6 символов</span>
        </div>
        <div class="field">
          <label>Повторите пароль</label>
          <input type="password" id="password2" placeholder="••••••••">
        </div>
        <button class="btn" id="btnSave">Сохранить пароль</button>
        <div class="error-msg hidden" id="errMsg"></div>
        <div class="info-msg hidden" id="infoMsg"></div>
      </div>
    </div>
  </div>
</div>

<script>
const errMsg = document.getElementById('errMsg');
const infoMsg = document.getElementById('infoMsg');
const formBlock = document.getElementById('formBlock');
function showError(msg){ infoMsg.classList.add('hidden'); errMsg.textContent = msg; errMsg.classList.remove('hidden'); }
function showInfo(msg){ errMsg.classList.add('hidden'); infoMsg.textContent = msg; infoMsg.classList.remove('hidden'); }

if (typeof window.supabase === 'undefined'){
  showError('Не удалось загрузить библиотеку Supabase (cdn.jsdelivr.net). Проверьте интернет-соединение и обновите страницу.');
  throw new Error('supabase-js CDN failed to load');
}
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storage: window.localStorage }
});

// ссылка из письма сброса пароля содержит одноразовый код в URL — supabase-js сам
// подхватывает его и открывает временную сессию восстановления при загрузке страницы
sb.auth.getSession().then(({ data }) => {
  if (!data.session){
    formBlock.querySelectorAll('input, button').forEach(el => el.disabled = true);
    showError('Ссылка для сброса пароля недействительна или устарела — запросите новую на странице входа.');
  }
});

document.getElementById('btnSave').addEventListener('click', async () => {
  showInfo(''); infoMsg.classList.add('hidden');
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  if (password.length < 6) return showError('Пароль должен быть не короче 6 символов.');
  if (password !== password2) return showError('Пароли не совпадают.');
  const { error } = await sb.auth.updateUser({ password });
  if (error) return showError(error.message);
  showInfo('Пароль обновлён — переходим в приложение…');
  setTimeout(() => { window.location.href = 'app.html'; }, 1200);
});
</script>
</body>
</html>
